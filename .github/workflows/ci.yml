name: CI

on:
  # v0.10.0 T-04: a suíte web só roda quando algo testável muda (espelho de
  # godot-ci.yml:11-25). Fora do filtro: specs/, docs, .dadaia/, raiz —
  # decisão explícita: nenhum desses altera o comportamento da suíte.
  push:
    branches: [main]
    paths:
      - "src/web-games/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/web-games/**"
      - ".github/workflows/ci.yml"
  # v0.10.0 T-01: experimento A/B GL/ANGLE — dispara 2 runs na mesma sha,
  # um com gl_args=true e outro false, mesmo test_cmd (subconjunto).
  # test_cmd VAZIO (default) = cada célula da matrix roda o próprio dir;
  # preenchido = override de diagnóstico, executado numa única célula.
  workflow_dispatch:
    inputs:
      gl_args:
        description: 'Ativa as 5 flags GL/ANGLE (PW_GL_ARGS=1)'
        type: boolean
        default: false
      test_cmd:
        description: 'Override de diagnóstico do step Run tests (vazio = matrix por jogo)'
        type: string
        default: ''

# v0.10.0 T-04: pushes empilhados cancelam o run anterior (fila de ~19 min
# do pior caso do baseline morre aqui).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright Tests (${{ matrix.game }})
    runs-on: ubuntu-latest

    # v0.10.0 T-09: split da suíte raiz em um job por jogo. workers:2 no
    # MESMO runner foi medido inviável (2×: boot starvation do SwiftShader —
    # runs 31536963772/31543170001), então o paralelismo sobe p/ runners
    # separados. Medição (run 31577396192): aero 6,8 min + space-war 6,5 +
    # corrida 2,8 = 16,3 min seriado; na matrix cada step fica ≤ 10 min.
    strategy:
      fail-fast: false
      matrix:
        game: [aero-fighters, corrida, space-war]

    defaults:
      run:
        working-directory: src/web-games

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web-games/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('src/web-games/package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium with system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Chromium system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: |
          if [ -n "$CMD" ]; then
            # override manual (diagnóstico): uma única célula executa, p/
            # não triplicar o custo do comando customizado
            if [ "${{ matrix.game }}" != "aero-fighters" ]; then
              echo "override manual: executado apenas na célula aero-fighters"
              exit 0
            fi
            eval "$CMD"
          else
            npx playwright test tests/${{ matrix.game }} --config=tests/playwright.config.js
          fi
        env:
          PW_GL_ARGS: ${{ github.event.inputs.gl_args == 'true' && '1' || '0' }}
          CMD: ${{ github.event.inputs.test_cmd }}

      # demolition-ball roda numa célula só (a menor) — job dedicado com
      # paths próprios (demolition-ball-ci.yml) assume na main pós-merge
      - name: Run demolition-ball tests (dedicated GL config)
        if: matrix.game == 'corrida'
        run: npm run test:demolition-ball

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ matrix.game }}
          path: |
            src/web-games/test-results/
            src/web-games/tests/screenshots/
          retention-days: 7
