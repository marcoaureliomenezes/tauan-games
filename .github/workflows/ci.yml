name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v0.10.0 T-01: experimento A/B GL/ANGLE — dispara 2 runs na mesma sha,
  # um com gl_args=true e outro false, mesmo test_cmd (subconjunto).
  workflow_dispatch:
    inputs:
      gl_args:
        description: 'Ativa as 5 flags GL/ANGLE (PW_GL_ARGS=1)'
        type: boolean
        default: false
      test_cmd:
        description: 'Comando de teste do step Run tests'
        type: string
        default: 'npm test'

permissions:
  contents: read

jobs:
  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/web-games

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web-games/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('src/web-games/package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright Chromium with system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Chromium system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: ${{ github.event.inputs.test_cmd || 'npm test' }}
        env:
          PW_GL_ARGS: ${{ github.event.inputs.gl_args == 'true' && '1' || '0' }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results
          path: |
            src/web-games/test-results/
            src/web-games/tests/screenshots/
          retention-days: 7
